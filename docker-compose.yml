services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine_password
      POSTGRES_DB: redmine_db
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Prisma マイグレーションのみ実行して終了（backend より先に走る）
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://redmine:redmine_password@db:5432/redmine_db
      TZ: Asia/Tokyo
    volumes:
      - ./backend/prisma:/app/backend/prisma
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "cd /app/backend && npx prisma generate --schema=./prisma/schema.prisma && npx prisma migrate deploy --schema=./prisma/schema.prisma",
      ]
    restart: "no"

  # MinIO S3-compatible storage (optional for local development)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Tokyo
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://redmine:redmine_password@db:5432/redmine_db
      JWT_SECRET: dev-jwt-secret-change-in-production
      TZ: Asia/Tokyo
      # S3 Configuration
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-redmine-uploads}
      # ローカルは LocalStack S3（scripts/init-localstack.sh でバケット作成）。MinIO を使う場合は http://minio:9000 に上書き
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://localstack:4566}
      # SES Configuration
      AWS_SES_ENDPOINT_URL: ${AWS_SES_ENDPOINT_URL:-http://localstack:4566}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@projecthub.local}
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

  # LocalStack for AWS SES testing
  localstack:
    image: localstack/localstack:3.8.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ses
      - AWS_DEFAULT_REGION=ap-northeast-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh

volumes:
  postgres_data:
  minio_data:
  localstack_data:
